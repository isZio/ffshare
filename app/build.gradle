plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.caydey.ffshare"
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            // environment variables from ~/.gradle/gradle.properties
            if (project.hasProperty('FFSHARE_RELEASE_STORE_FILE')) {
                storeFile file(FFSHARE_RELEASE_STORE_FILE)
                storePassword FFSHARE_RELEASE_STORE_PASSWORD
                keyAlias FFSHARE_RELEASE_KEY_ALIAS
                keyPassword FFSHARE_RELEASE_KEY_PASSWORD
            }
        }
    }
    
    splits {
        // Configures multiple APKs based on ABI.
        abi {
          // only ship 64 bit arm builds
          enable true

          // Resets the list of ABIs for Gradle to create APKs for to none.
          reset()

          //noinspection ChromeOsAbiSupport
          include "arm64-v8a"

          // explicitly no universal apk, one arm64 apk only
          universalApk false
        }
    }

    buildTypes {
        release {
            // ABI filtering is handled by the splits block above
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('FFSHARE_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.caydey.ffshare'
}
dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.1'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.3'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // upsteam used a locally built ffmpeg-kit-next aar (app/libs is gitignored).
    // ffmpeg-kit was retired in Jan 2025, so this is the maintained drop-in fork:
    // same package (com.arthenica.ffmpegkit), same API, GPL variant needed for x264/x265.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9'
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    implementation 'com.jakewharton.timber:timber:5.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}